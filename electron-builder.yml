appId: com.cardforge.desktop
productName: CardForge
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/corel
    to: corel
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
asar: true
