appId: com.cardforge.desktop
productName: 1st of June
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/corel
    to: corel
  - from: resources/samples
    to: samples
  - from: resources/icon.png
    to: icon.png
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
asar: true
